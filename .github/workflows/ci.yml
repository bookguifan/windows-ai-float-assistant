name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 同一分支 / PR 上新的提交会取消仍在运行的旧任务。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, lint & test (Windows)
    # 本项目仅面向 Windows，且 `windows` crate 无 target 门控，
    # 因此必须在 Windows 上编译与测试。
    runs-on: windows-latest

    defaults:
      run:
        working-directory: deepseek-float

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 package.json 固定的 pnpm 基线一致；保留冻结安装。
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: deepseek-float/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 前端产物会被 `tauri::generate_context!` 在编译期内嵌，
      # 故必须先构建前端，随后的 cargo check / clippy / test 才能通过。
      - name: Build frontend
        run: pnpm build

      - name: JavaScript unit tests
        run: pnpm test:unit

      - name: Install test browser
        run: pnpm exec playwright install chromium

      - name: Browser regression
        run: pnpm test:js

      # CSP reads the freshly built dist/. Reuse the existing aggregate.
      - name: Frontend, version and security checks
        run: pnpm check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: deepseek-float/src-tauri -> target

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: clippy (isolated test feature, all targets)
        env:
          TAURI_CONFIG: '{"identifier":"com.deepseekfloat.beta2.isolated.ci"}'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --features beta2-isolation -- -D warnings

      # The production build includes compilation checks for the same profile/features.
      - name: Ordinary Release build (no test feature)
        env:
          CARGO_INCREMENTAL: '0'
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol --bin deepseek-float

      - name: Ordinary Release window bootstrap
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol --test isolation_window_bootstrap

      - name: test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test selection_core --test copy_engine --test native_copy_proof --test uia_strategy --test release_selection_policy --test native_selection_policy --test isolation_window_bootstrap

      - name: Isolated path and Tauri bootstrap regressions (mock runtime, no native app)
        env:
          TAURI_CONFIG: '{"identifier":"com.deepseekfloat.beta2.isolated.ci"}'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features beta2-isolation --test isolation_paths --test isolation_window_bootstrap
      - name: Release isolated paths and Tauri bootstrap (no native app)
        env:
          TAURI_CONFIG: '{"identifier":"com.deepseekfloat.beta2.isolated.ci"}'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol,beta2-isolation --test isolation_paths --test isolation_window_bootstrap

      - name: Experimental debug policy tests (no clipboard operations)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features experimental-clipboard-fallback --test release_selection_policy

      - name: Release policy cannot be unlocked by experimental feature
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol,experimental-clipboard-fallback --test release_selection_policy

      # ★ 注意：`pnpm e2e:shell`（脱离 dev server 验证产物能独立运行）**不在 CI 里** ——
      # 它要拉起 GUI + WebView2 + CDP 调试端口，需要真实桌面会话。请把它留给本机
      # 单独授权的本机回归。当前发布范围与剩余门禁见 `docs/beta2-release-preparation.md`。
